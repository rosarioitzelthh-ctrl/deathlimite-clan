name: Cloud DB 24-7 Sync
on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync ntfy cloud state to gh-pages clan-state.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
          (async () => {
            const zlib = require("zlib");
            const repo = process.env.GITHUB_REPOSITORY;
            const token = process.env.GH_TOKEN;
            const topicUrl = "https://ntfy.sh/deathlimite_clan_sync_v11";
            const apiUrl = "https://api.github.com/repos/" + repo + "/contents/clan-state.json";
            const headers = { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "User-Agent": "gh-action" };

            const ghRes = await fetch(apiUrl + "?ref=gh-pages", { headers });
            let ghSha = null, ghState = null;
            if (ghRes.ok) {
              const ghMeta = await ghRes.json();
              ghSha = ghMeta.sha;
              ghState = JSON.parse(Buffer.from(ghMeta.content, "base64").toString("utf8"));
            }

            const photoMap = {};
            for (const p of (ghState?.posts || [])) {
              if (p.id && p.imageData && p.imageData.startsWith("data:")) photoMap[p.id] = p.imageData;
            }

            const nRes = await fetch(topicUrl + "/json?poll=1&since=12h");
            const text = await nRes.text();
            const lines = text.trim().split("\n").filter(Boolean);
            let relayState = null;
            for (let i = lines.length - 1; i >= 0; i--) {
              try {
                const msg = JSON.parse(lines[i]);
                if (msg.event === "message" && typeof msg.message === "string" && msg.message.startsWith("GZ:")) {
                  const json = zlib.gunzipSync(Buffer.from(msg.message.slice(3), "base64")).toString("utf8");
                  relayState = JSON.parse(json);
                  break;
                }
              } catch (e) {}
            }

            if (relayState && (!ghState || (Number(relayState.version) || 0) > (Number(ghState.version) || 0))) {
              relayState.posts = (relayState.posts || []).map(p => p.imageData === "__PHOTO_REF__" && photoMap[p.id] ? { ...p, imageData: photoMap[p.id] } : p);
              await fetch(apiUrl, {
                method: "PUT",
                headers: { ...headers, "Content-Type": "application/json" },
                body: JSON.stringify({
                  message: "Auto-backup clan state v" + relayState.version,
                  content: Buffer.from(JSON.stringify(relayState, null, 2), "utf8").toString("base64"),
                  branch: "gh-pages",
                  ...(ghSha ? { sha: ghSha } : {})
                })
              });
              console.log("Backed up version", relayState.version);
            } else if (ghState && !relayState) {
              const lite = { ...ghState, posts: (ghState.posts || []).map(p => ({ ...p, imageData: p.imageData ? "__PHOTO_REF__" : "" })) };
              const gz = "GZ:" + zlib.gzipSync(JSON.stringify(lite)).toString("base64");
              await fetch(topicUrl, { method: "POST", headers: { Title: String(ghState.version || 1) }, body: gz });
              console.log("Refreshed ntfy from ghState");
            }
          })();
          '
